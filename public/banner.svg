<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13aa52" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00ED64" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13aa52"/>
      <stop offset="100%" stop-color="#00ED64"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#001E2B" rx="10"/>
  <rect width="800" height="200" fill="url(#bg-gradient)" rx="10"/>
  
  <!-- Grid pattern -->
  <g stroke="#00ED64" stroke-opacity="0.1" stroke-width="1">
    <g id="grid-vertical">
      <line x1="50" y1="0" x2="50" y2="200"/>
      <line x1="100" y1="0" x2="100" y2="200"/>
      <line x1="150" y1="0" x2="150" y2="200"/>
      <line x1="200" y1="0" x2="200" y2="200"/>
      <line x1="250" y1="0" x2="250" y2="200"/>
      <line x1="300" y1="0" x2="300" y2="200"/>
      <line x1="350" y1="0" x2="350" y2="200"/>
      <line x1="400" y1="0" x2="400" y2="200"/>
      <line x1="450" y1="0" x2="450" y2="200"/>
      <line x1="500" y1="0" x2="500" y2="200"/>
      <line x1="550" y1="0" x2="550" y2="200"/>
      <line x1="600" y1="0" x2="600" y2="200"/>
      <line x1="650" y1="0" x2="650" y2="200"/>
      <line x1="700" y1="0" x2="700" y2="200"/>
      <line x1="750" y1="0" x2="750" y2="200"/>
    </g>
    <g id="grid-horizontal">
      <line x1="0" y1="25" x2="800" y2="25"/>
      <line x1="0" y1="50" x2="800" y2="50"/>
      <line x1="0" y1="75" x2="800" y2="75"/>
      <line x1="0" y1="100" x2="800" y2="100"/>
      <line x1="0" y1="125" x2="800" y2="125"/>
      <line x1="0" y1="150" x2="800" y2="150"/>
      <line x1="0" y1="175" x2="800" y2="175"/>
    </g>
  </g>
  
  <!-- MongoDB Leaf -->
  <g transform="translate(120, 100) scale(0.4)">
    <path fill="#00ED64" d="M94.75,119.972c-5.928,68.891-39.683,91.011-42.307,99.496 c-3.229,6.115-6.401,16.879-6.401,16.879l-2.164-0.142c0,0,0.848-7.095,0.145-17.167 c-0.562-7.882-3.463-7.062-3.463-7.062c-18.698,14.981-40.351,13.869-48.559,10.403 c-8.208-3.467-18.395-16.057-21.462-35.016C-32.533,168.4,33.483,119.972,63.21,76.789 C93.064,33.471,100.689,51.071,100.689,51.071S100.68,51.08,94.75,119.972z"></path>
  </g>
  
  <!-- Text -->
  <text x="220" y="110" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#text-gradient)">
    MongoDB Developer's
  </text>
  <text x="350" y="160" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">
    LAUNCH PAD
  </text>
  
  <!-- israai.club tag -->
  <rect x="650" y="20" width="130" height="30" rx="15" fill="#00ED64" fill-opacity="0.3"/>
  <text x="715" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00ED64" text-anchor="middle">
    israai.club
  </text>
  
  <!-- Flag of Israel -->
  <g transform="translate(635, 35) scale(0.4)">
    <rect x="0" y="-25" width="40" height="30" fill="#ffffff" />
    <rect x="0" y="-25" width="40" height="30" stroke="#0038b8" stroke-width="1" fill="none" />
    <polyline points="20,-25 8,-5 20,15 32,-5 20,-25" stroke="#0038b8" stroke-width="1" fill="none" />
    <line x1="8" y1="-5" x2="32" y2="-5" stroke="#0038b8" stroke-width="1" />
  </g>
</svg> 